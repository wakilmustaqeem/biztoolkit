name: BizToolkit Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read & Check endpoints
        id: check
        shell: bash
        run: |
          set +e

          HOMEPAGE=$(curl -fsS -o /dev/null -w "%{http_code}" --max-time 15 https://biztoolkit-ashy.vercel.app/)
          SITEMAP=$(curl -fsS -o /dev/null -w "%{http_code}" --max-time 15 https://biztoolkit-ashy.vercel.app/sitemap.xml)
          ROBOTS=$(curl -fsS -o /dev/null -w "%{http_code}" --max-time 15 https://biztoolkit-ashy.vercel.app/robots.txt)

          CALCULATOR_ROUTES=(
            /profit-margin-calculator
            /roi-calculator
            /break-even-calculator
            /markup-calculator
            /discount-calculator
            /commission-calculator
            /vat-calculator
          )

          CALC_FAILURES=0
          for route in "${CALCULATOR_ROUTES[@]}"; do
            code=$(curl -fsS -o /dev/null -w "%{http_code}" --max-time 15 "https://biztoolkit-ashy.vercel.app$route")
            echo "$route: $code"
            if [ "$code" != "200" ]; then
              CALC_FAILURES=$((CALC_FAILURES + 1))
            fi
          done

          echo "Homepage: $HOMEPAGE"
          echo "Sitemap: $SITEMAP"
          echo "Robots: $ROBOTS"
          echo "Calculator route failures: $CALC_FAILURES"

          if [ "$HOMEPAGE" != "200" ] || [ "$SITEMAP" != "200" ] || [ "$ROBOTS" != "200" ] || [ "$CALC_FAILURES" -ne 0 ]; then
            echo "❌ Check Failed!" > report.txt
            echo "Homepage: $HOMEPAGE" >> report.txt
            echo "Sitemap: $SITEMAP" >> report.txt
            echo "Robots: $ROBOTS" >> report.txt
            echo "Calculator route failures: $CALC_FAILURES" >> report.txt
            echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> report.txt
            exit 1
          fi

          echo "✅ All checks passed!" > report.txt
          echo "Homepage: $HOMEPAGE, Sitemap: $SITEMAP, Robots: $ROBOTS, Calculators: 7/7" >> report.txt
          echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> report.txt

      - name: Report (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-report
          path: report.txt
          if-no-files-found: ignore

      - name: Alert (Reuse Open Issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('report.txt')
              ? fs.readFileSync('report.txt', 'utf8')
              : 'Monitoring workflow failed before report.txt was created.';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['monitoring'],
              per_page: 100
            });

            const existing = issues.find(issue =>
              issue.title.includes('BizToolkit Monitor Alert')
            );

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: report
              });
              console.log(`Updated existing issue #${existing.number}`);
            } else {
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 BizToolkit Monitor Alert - Site Issue Detected',
                body: report,
                labels: ['monitoring']
              });
              console.log(`Created new issue #${newIssue.number}`);
            }
