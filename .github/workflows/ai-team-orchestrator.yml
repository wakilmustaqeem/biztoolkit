name: AI Team Orchestrator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  issues: write

jobs:
  planner:
    name: Planner AI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit calculator mission
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('calculator-manifest.json')
          if not p.exists():
              raise SystemExit('calculator-manifest.json not found')
          m = json.loads(p.read_text())
          print('Target:', m.get('target'))
          print('Count rule:', m.get('countRule'))
          print('Planner AI: manifest available for next build cycle')
          PY

  qa:
    name: QA AI
    needs: planner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build

  report:
    name: Deploy & Monitor AI
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create mission report
        run: |
          echo 'AI Team Orchestrator: planner + QA completed.'
          echo 'Production deployment remains protected by existing GitHub/Vercel gates.'
